{% load i18n %}
<div class="tab-pane" id="undefine" role="tabpanel">
    <!-- Nav tabs -->
    <div class="card">
    <div class="card-header bg-transparent pb-0">
    <ul class="nav nav-underline small" role="tablist" aria-label="Instance destroy menu">
        <li class="nav-item">
            <a class="nav-link active" href="#destroy" aria-controls="destroy" role="tab" data-bs-toggle="tab">
                {% trans "Destroy Instance" %}
            </a>
        </li>
    </ul>
    </div>
    <!-- Tab panes -->
    <div class="tab-content card-body">
        <div role="tabpanel" class="tab-pane active" id="destroy">
            <p>{% trans 'This action starts remove instance process' %}</p>
            {% if can_delete %}
                <a href="{% url 'instances:destroy' instance.id %}" class="btn btn-danger float-end">{% trans "Destroy" %}</a>
            {% else %}
                <button class="btn btn-danger disabled float-end" name="delete">{% trans "Destroy" %}</button>
            {% endif %}
            <div class="clearfix"></div>
        </div>
    </div>
    </div>
</div>
