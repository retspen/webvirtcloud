{% load i18n %}{% load operations %}{% load bootstrap_icons %}{% if backup.state == "ready" %}<a class="btn btn-sm btn-outline-primary me-1" href="{% url 'vmbackups:restore' backup.uuid %}">{% trans "Restore" %}</a>{% endif %}{% if backup.state != "creating" %}<form method="post" action="{% url 'vmbackups:delete' backup.uuid %}" class="d-inline">{% csrf_token %}{% submission_key %}
<button type="submit" class="btn btn-sm btn-outline-danger" aria-label="{% trans "Delete" %}" title="{% trans "Delete" %}"
        data-confirm="{% blocktrans with time=backup.created_at|date:"Y-m-d H:i" vm=backup.vm_name %}Delete the backup of {{ vm }} taken {{ time }}? Its files are removed from the target.{% endblocktrans %}">{% bs_icon 'trash' %}</button></form>{% endif %}
