{% extends "base.html" %}
{% load django_bootstrap5 %}
{% load i18n %}

{% block title %}{{ title }}{% endblock %}

{% block page_header %}
<div class="row justify-content-center">
    <div class="col-lg-8"><h3 class="mb-3">{{ title }}</h3></div>
</div>
{% endblock page_header %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <form method="post">
            {% csrf_token %}
            <div class="card mb-3">
                <div class="card-body">{% bootstrap_form form %}</div>
            </div>
            <div class="d-flex flex-wrap justify-content-end gap-2">
                <a class="btn btn-outline-secondary" href="javascript:history.back()">{% trans "Cancel" %}</a>
                <button type="submit" class="btn btn-primary">{% trans "Save" %}</button>
            </div>
        </form>
    </div>
</div>
{% endblock content %}
