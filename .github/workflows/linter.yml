name: Lint

# a branch with a pull request (also one stacked on another) is tested by its
# pull_request run; push runs for every branch tested each commit twice
on:
  push:
    branches: [master]
  pull_request:

# the jobs only read the code
permissions:
  contents: read

jobs:
  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Same ruff version as dev/requirements.txt
      - name: Install Ruff
        run: pip install "$(grep '^ruff==' dev/requirements.txt)"

      - name: Run Ruff
        run: ruff check --output-format=github .
