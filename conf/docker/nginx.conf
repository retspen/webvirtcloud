# nginx of the container: the panel's site (conf/nginx/webvirtcloud.conf),
# errors to docker logs; gunicorn logs the requests.
user www-data;
worker_processes 1;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    access_log off;
    include /etc/nginx/conf.d/*.conf;
}
