{# a new pool's type as a radio card: kind, title, help; pool_kind is the chosen one #}
<div class="col">
    <label class="source-option border rounded p-2 h-100 d-flex gap-2">
        <input class="form-check-input flex-shrink-0 mt-1" type="radio" name="pool_kind" value="{{ kind }}"{% if kind == pool_kind %} checked{% endif %}>
        <span><span class="d-block fw-semibold">{{ title }}</span><span class="d-block small text-body-secondary">{{ help }}</span></span>
    </label>
</div>
