{% load i18n %}
{% load bootstrap_icons %}
{% if request.user.is_superuser %}
<a href="#AddSecret" type="button" class="btn btn-success float-end" title="{% trans "Create New Secret" %}" data-bs-toggle="modal">
    <span aria-hidden="true">{% bs_icon 'plus-circle-fill' %} </span>
</a>

<!-- Modal Secret -->
<div class="modal fade" id="AddSecret" tabindex="-1" role="dialog" aria-labelledby="AddSecret" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">{% trans "Create New Secret" %}</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form method="post" action="" role="form" aria-label="Create Secret form">{% csrf_token %}
                <div class="modal-body">
                    <div class="row">
                        <label for="secret_usage_type" class="col-sm-3 col-form-label">{% trans "Usage" %}</label>
                        <div class="col-sm-6">
                            <select id="secret_usage_type" name="usage_type" class="form-control">
                                {% for value, label in usage_choices %}
                                <option value="{{ value }}">{{ label }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                    <div class="row">
                        <label for="secret_usage" class="col-sm-3 col-form-label">{% trans "Data" %}</label>
                        <div class="col-sm-6">
                            <input id="secret_usage" type="text" name="usage" class="form-control" required>
                        </div>
                    </div>
                    <div class="row">
                        <label for="secret_value" class="col-sm-3 col-form-label">{% trans "Value" %}</label>
                        <div class="col-sm-6">
                            <input id="secret_value" type="password" name="value" class="form-control" autocomplete="new-password">
                        </div>
                    </div>
                    <div class="form-check">
                        <input id="secret_ephemeral" type="checkbox" name="ephemeral" class="form-check-input">
                        <label for="secret_ephemeral" class="form-check-label">{% trans "Ephemeral" %}</label>
                    </div>
                    <div class="form-check">
                        <input id="secret_private" type="checkbox" name="private" class="form-check-input">
                        <label for="secret_private" class="form-check-label">{% trans "Private" %}</label>
                    </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">{% trans "Close" %}</button>
                <button type="submit" class="btn btn-primary" name="create">{% trans "Create" %}</button>
            </div>
            </form>
        </div> <!-- /.modal-content -->
    </div> <!-- /.modal-dialog -->
</div><!-- /.modal -->
{% endif %}
